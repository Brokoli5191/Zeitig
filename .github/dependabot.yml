version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, maintenance]
    commit-message:
      prefix: "build(deps)"
    groups:
      androidx-compose:
        patterns: ["androidx.compose*", "androidx.compose.*:*"]
      androidx:
        patterns: ["androidx.*"]
        exclude-patterns: ["androidx.compose*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "org.jetbrains.kotlinx*"]
      build-tooling:
        patterns: ["com.android.tools.build*", "com.android.*", "com.diffplug.spotless*", "org.jetbrains.kotlinx.kover*"]
      testing:
        patterns: ["org.robolectric*", "io.github.takahirom.roborazzi*", "junit*", "org.junit*"]
      other:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, maintenance]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

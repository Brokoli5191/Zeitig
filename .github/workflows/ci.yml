name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Spotless, lint, unit + screenshot tests, coverage gate, debug APK
        run: >-
          ./gradlew --continue
          spotlessCheck lint testDebugUnitTest verifyRoborazziDebug :core:koverVerify assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zeitig-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

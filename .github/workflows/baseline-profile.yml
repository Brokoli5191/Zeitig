name: Baseline profile

# On demand: generate the app's Baseline Profile on a Gradle Managed Device (Pixel 6, API 34,
# AOSP image) and propose it as a pull request when it changed. GitHub-hosted x86_64 Linux
# runners expose KVM once the udev rule below grants access; ARM runners have no /dev/kvm.
#
# The profile is also uploaded as an artifact, so it is never lost when the PR step cannot run.
# Like refresh-stops.yml, PRs created with GITHUB_TOKEN do not trigger CI, and creating them
# requires "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General → Workflow permissions).

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: baseline-profile
  cancel-in-progress: false

jobs:
  generate:
    name: Generate on a managed emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Accept SDK licences for the system image
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate Baseline Profile
        run: >-
          ./gradlew :app:generateBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload profile and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: |
            app/src/release/generated/baselineProfiles/
            baselineprofile/build/outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          profiles=app/src/release/generated/baselineProfiles
          if [[ -z "$(git status --porcelain -- "$profiles")" ]]; then
            echo "Baseline Profile unchanged."
            exit 0
          fi
          branch="perf/baseline-profile-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$profiles"
          git commit -m "perf(app): update Baseline Profile"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --label maintenance \
            --title "perf(app): update Baseline Profile" \
            --body "Generated by the Baseline profile workflow (run ${GITHUB_RUN_ID}) on a managed Pixel 6 emulator, API 34. The profile only changes how ART precompiles the app; behaviour is unchanged."

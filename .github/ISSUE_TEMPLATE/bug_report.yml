name: Bug report
description: Something in Zeitig behaves wrong or crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please never paste personal data (home address, exact coordinates) into an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open favourite "Office"
        2. Tap "I'm leaving"
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zeitig version
      description: Settings → About shows it, e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Samsung Galaxy S23, One UI 8, Android 16
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - GitHub Releases
        - Obtainium
        - IzzyOnDroid
        - Built from source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: "Optional. `adb logcat --pid=$(adb shell pidof app.brokoli5191.zeitig)` helps a lot."
      render: shell

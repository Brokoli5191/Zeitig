# Categories for GitHub-generated release notes. Every PR carries one of these labels.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [fix, bug]
    - title: Maintenance
      labels: [maintenance, dependencies, ci, docs]
    - title: Other changes
      labels: ["*"]
